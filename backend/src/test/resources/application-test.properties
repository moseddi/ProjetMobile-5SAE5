# Test profile: use an embedded MongoDB (Flapdoodle) instead of the real Atlas
# cluster, and disable data seeding so each test controls its own fixtures.
app.seed-data.enabled=false

# Embedded MongoDB version used by Flapdoodle during tests.
de.flapdoodle.mongodb.embedded.version=6.0.4

# Never call a real LLM during automated tests (keeps tests offline & fast).
ai.enabled=false
ai.gemini.api-key=

# Silence verbose Mongo/Spring logs during tests.
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=WARN
