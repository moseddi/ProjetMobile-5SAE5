# Application
spring.config.import=optional:file:.env[.properties]
spring.application.name=hangout-backend
server.port=8081

# MongoDB - URI from environment variable
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=hangout_db

# Enable seed data on startup (set to false in production)
app.seed-data.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-must-be-at-least-256-bits}
jwt.expiration=86400000

# CORS Configuration
# Flutter (localhost:*), Android Emulator (10.0.2.2:*), React (localhost:5173, localhost:4173)
cors.allowed-origins=http://localhost:*,http://10.0.2.2:*,http://localhost:5173,http://localhost:4173

# Logging
logging.level.com.hangout=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG


#Api chaima 
#ai.api-key=${LLM_API_KEY:}
#ai.model=${LLM_MODEL:gemini-3.1-flash-lite}
#ai.embedding-model=${LLM_EMBEDDING_MODEL:gemini-embedding-001}
#ai.timeout-seconds=20
# ============================================
# IA - Embeddings Gemini (recherche sémantique)
# ============================================
ai.api-key=${LLM_API_KEY:}
ai.embedding-model=${LLM_EMBEDDING_MODEL:gemini-embedding-001}

# ============================================
# IA - Génération via Groq (explications RAG)
# ============================================
ai.groq-api-key=${GROQ_API_KEY:}
ai.groq-model=${GROQ_MODEL:openai/gpt-oss-120b}

# Timeout (30s pour laisser le temps à Groq de répondre)
ai.timeout-seconds=30

# ============================================
# AI Module (LLM) - HangOut Assistant
# Set GEMINI_API_KEY in the environment to enable the LLM.
# Without a key the app automatically falls back to a rule-based recommendation.
# ============================================
ai.enabled=${AI_ENABLED:true}
ai.provider=gemini
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
ai.gemini.models=${GEMINI_MODELS:gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-flash-lite-latest}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
ai.timeout-ms=15000

# ============================================
# Menu Assistant (restaurant management): menu-photo extraction, dish
# embeddings/RAG and the customer-facing dish chat/photo-search widget.
# Uses Gemini's OpenAI-compatible endpoint (chat completions + embeddings).
# Set MENU_LLM_API_KEY in the environment to enable it.
# ============================================
llm.base-url=${MENU_LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
llm.api-key=${MENU_LLM_API_KEY:}
llm.model=${MENU_LLM_MODEL:gemini-3.5-flash}
llm.embedding-model=${MENU_LLM_EMBEDDING_MODEL:gemini-embedding-001}

# Directory where uploaded menu photos are stored (served back under /api/restaurants/menu-files/**)
app.upload.dir=${UPLOAD_DIR:uploads}

# ============================================
# Reservations - availability rules
# ============================================
reservation.slot-duration-minutes=120
reservation.default-capacity=40
reservation.last-seating-minutes-before-close=60
reservation.min-party-size=1
reservation.max-party-size=20

# ============================================
# Reservation Chatbot (Groq) - the key is read ONLY from the GROQ_API_KEY environment variable
# ============================================
groq.api-key=${GROQ_API_KEY:}
groq.model=${RESERVATION_GROQ_MODEL:openai/gpt-oss-20b}
groq.base-url=https://api.groq.com/openai/v1
groq.timeout-seconds=15
groq.max-completion-tokens=1024
groq.structured-output=true

# Chatbot guards
chatbot.max-message-length=500
chatbot.max-history=10
chatbot.rate-limit-per-minute=10
chatbot.max-suggested-slots=8
