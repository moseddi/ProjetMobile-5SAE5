name: hangout_app
description: A restaurant discovery, reservation, loyalty and social dining Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^9.0.0
  geocoding: ^2.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
